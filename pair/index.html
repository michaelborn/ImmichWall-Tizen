<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Pair Immich Wall</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="card">
        <p class="eyebrow">IMMICH WALL</p>
        <h1>Connect your TV</h1>
        <p class="step-label" id="step-label">Step 1 of 2 · Verify the PIN</p>
        <p id="intro">Enter the five-digit PIN shown on your TV.</p>

        <form id="pair-form" novalidate>
            <section id="step-pin" class="step">
                <label for="pin">PIN shown on your TV</label>
                <input id="pin" name="pin" type="text" inputmode="numeric" autocomplete="one-time-code"
                       pattern="[0-9]{5}" maxlength="5" required>
                <button id="verify-button" type="submit">Continue</button>
            </section>

            <section id="step-details" class="step hidden">
                <label for="server-url">Immich server URL</label>
                <input id="server-url" name="server-url" type="url" inputmode="url" autocomplete="url" value="" required>

                <label for="api-key">Immich API key</label>
                <input id="api-key" name="api-key" type="password" autocomplete="off" required>
                <button id="submit-button" type="submit">Connect TV</button>
            </section>

            <button id="start-over" class="link-button hidden" type="button">Start over</button>
        </form>

        <p id="status" role="status" aria-live="polite"></p>
        <p class="note">Use a read-only Immich API key. Your credentials are sent directly to this pairing service and are erased after the TV saves them.</p>
    </main>
    <script src="app.js"></script>
</body>
</html>
